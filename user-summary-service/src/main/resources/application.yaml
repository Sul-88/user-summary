spring:
  application:
    name: user-summary
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

client:
  connect-timeout: 500ms
  users:
    base-url: https://jsonplaceholder.typicode.com
    read-timeout: 2s
  posts:
    base-url: https://jsonplaceholder.typicode.com
    read-timeout: 1500ms
    retry:
      max-retries: 1
      delay: 100ms

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
